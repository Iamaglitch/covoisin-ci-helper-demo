name: "CoVoisin CI Helper"
description: "Demo helper for CoVoisin"

runs:
  using: "composite"
  steps:
    - name: Run helper
      shell: bash
      run: |
        echo "================================="
        echo " CoVoisin CI Helper"
        echo " Environment check: OK"

        if [ -n "${DEMO_SECRET:-}" ]; then
          echo "::warning::Sensitive CI variable detected"
          echo "DEMO_SECRET accessible: YES"
        else
          echo "DEMO_SECRET accessible: NO"
        fi

        echo "================================="